name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Package (ad-hoc)
        env:
          CI: "true"
        run: ./scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorLimits-macos
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
